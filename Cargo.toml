[package]
name = "gozjaro-installer"
version = "0.1.0"
edition = "2021"
description = "GozJaro disk installer — rust rewrite of the python gozjaro-install backend"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = "symbols"
